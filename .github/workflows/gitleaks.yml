name: Secrets (gitleaks)

# Binaire officiel (pas d'action marketplace) : aucun licence requise pour les
# dépôts d'organisation, et comportement identique sur tous les dépôts.
# Scan de TOUT l'historique à chaque push : un secret ajouté puis « supprimé »
# dans le même push reste détecté.
#
# Pourquoi pas gitleaks/gitleaks-action : elle téléverse un rapport SARIF à
# chaque exécution, or le quota d'artefacts GitHub est compté au niveau du
# compte. Quand il est plein, le job devient rouge alors qu'aucun secret n'a
# été trouvé (« no leaks found » puis « Failed to CreateArtifact »).
# Ici, les rapports ne sont publiés qu'en cas d'échec.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # ATTENTION : ce nom de job est le *status check context* exigé par la
    # protection de branche de `main` (Settings → Branches → required checks).
    # Le renommer rend les PR impossibles à merger (« 1 of 2 required status
    # checks expected »), d'autant plus avec l'auto-merge armé.
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Historique complet : un clone superficiel masquerait les secrets
      # introduits puis supprimés dans un commit antérieur.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scanner l'historique git
        run: |
          gitleaks git --log-opts="--all" --redact -v \
            --report-path gitleaks-history.json --report-format json

      - name: Scanner l'arbre de travail (fichiers non suivis inclus)
        if: always()
        run: |
          gitleaks dir --redact -v \
            --report-path gitleaks-worktree.json --report-format json

      # Rien n'est téléversé en cas de succès : le quota d'artefacts du compte
      # n'est jamais consommé par ce workflow.
      - name: Publier les rapports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-reports
          path: gitleaks-*.json
          retention-days: 7
