name: ci

# Vérifications AVANT déploiement : build Eleventy + suite de tests complète
# à chaque pull request et après chaque push sur main.
#
# Le déploiement lui-même reste assuré par Cloudflare Pages (intégration Git) :
# cette CI sert de barrière de qualité avant merge — activez la protection de
# branche GitHub (main → Require status checks → "ci / verify") pour que les
# PRs ne soient pas fusionnables tant que le build/test échoue.
#
# Aucun secret requis : le build n'a pas besoin de GA_MEASUREMENT_ID réel
# (placeholder G-XXXXXXXXXX) ni des clés Turnstile/SumUp.
# Le check du funnel de paiement live (`npm run check:payment`) exige un site
# déployé + des secrets prod : il reste dans deploy-check.yml, post-déploiement.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Build
        run: npm run build

      - name: Tests (logic, emails, smoke, links)
        run: npm test
