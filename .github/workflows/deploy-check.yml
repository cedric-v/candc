name: deploy-check

# Après chaque push sur main (qui déclenche un déploiement Cloudflare Pages),
# vérifie que le site build, que les tests locaux passent et que le funnel de
# réservation en ligne répond correctement (disponibilité + tarif + checkout
# SumUp via `npm run check:payment`, qui crée puis annule une réservation de
# test). Tout échec fait échouer le workflow.
#
# Le secret `CF_API_TOKEN` (lecture Pages + lecture compte) est optionnel :
# s'il est présent, le workflow attend que LE déploiement de ce commit soit
# en ligne avant de tester ; sinon il attend une durée fixe. Voir
# DEPLOYMENT.md (section Vérification post-déploiement).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Post-deploy booking check
    runs-on: ubuntu-latest
    # 25 min d'attente possible du deployment Pages + build/tests/funnel live :
    # le job doit rester plus long que l'attente, sinon il est tué avant.
    timeout-minutes: 45
    env:
      # Exposé au niveau du job pour pouvoir tester sa présence dans les `if:`
      # des steps (le contexte secrets n'y est pas autorisé).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      # fetch-depth: 0 — nécessaire à `scripts/wait-for-pages-deploy.mjs` pour
      # vérifier, quand le build du commit a été « skipped » (supplanté par un
      # push plus récent), que le deployment canonique contient bien ce commit
      # (`git merge-base --is-ancestor`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Wait for Pages deployment (API token)
        if: env.CF_API_TOKEN != ''
        run: node scripts/wait-for-pages-deploy.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 0bf811c45bce0791347e92465f3e06f8
          CF_PROJECT: candc-ch
          COMMIT_SHA: ${{ github.sha }}
          # Un build Pages peut légalement durer 20 min (limite Cloudflare) :
          # attendre plus longtemps que la limite, pas moins.
          TIMEOUT_MS: 1500000

      - name: Wait for Pages build (no API token)
        if: env.CF_API_TOKEN == ''
        run: sleep 240

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run local tests
        run: npm test

      - name: Live payment funnel check
        run: npm run check:payment

      - name: Live pages check (no 404, images served)
        run: npm run check:pages
